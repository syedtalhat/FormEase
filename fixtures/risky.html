<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scholarship Registration Fee Clearance Gateway</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fff1f2; color: #1e293b; padding: 24px; }
    .portal-container { max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 8px; border: 2px solid #fda4af; box-shadow: 0 4px 16px rgba(225,29,72,0.1); }
    .header { background: #be123c; color: #ffffff; padding: 18px 24px; border-top-left-radius: 6px; border-top-right-radius: 6px; }
    .header h1 { font-size: 18px; font-weight: 700; }
    .header p { font-size: 12px; color: #fecdd3; }
    .form-body { padding: 24px; }
    .alert-banner { background: #ffe4e6; border-left: 4px solid #e11d48; padding: 10px 14px; font-size: 13px; color: #9f1239; margin-bottom: 18px; }
    .form-group { display: flex; flex-direction: column; margin-bottom: 16px; }
    label { font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 5px; }
    input { padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; }
    .btn { width: 100%; padding: 12px; font-size: 15px; font-weight: 700; border-radius: 6px; cursor: pointer; border: none; background: #e11d48; color: #fff; }
  </style>
</head>
<body>
  <div class="portal-container">
    <div class="header">
      <h1>Scholarship Application Fee Gateway</h1>
      <p>Urgent Notice: Pay INR 150 processing fee to finalize application</p>
    </div>

    <!-- Cross-domain action mismatch to trigger FR-RISK.1, non-HTTPS to trigger FR-RISK.2 -->
    <form id="fee-pay-form" action="https://pay-verify.example.net/submit" method="POST" class="form-body">
      <div class="alert-banner">
        Immediate authorization required before application deadline expires.
      </div>

      <div class="form-group">
        <label for="mobile_number">Mobile Number*</label>
        <input type="text" id="mobile_number" name="mobile_number" placeholder="10-digit mobile number" required />
      </div>

      <div class="form-group">
        <label for="six_digit_otp">6-digit SMS OTP*</label>
        <input type="text" id="six_digit_otp" name="six_digit_otp" placeholder="Enter OTP received via SMS" required />
      </div>

      <button type="submit" class="btn">Pay &amp; Authorize Application</button>
    </form>
  </div>
</body>
</html>
